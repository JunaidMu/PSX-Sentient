# Web app (port 80, public) + password-protected MLflow (5000) and Prometheus (9090).
# MLflow and Prometheus containers are not published directly; nginx is the only way in from outside.
# Credentials: deploy/htpasswd, generated from ADMIN_USER / ADMIN_PASSWORD by scripts/make_htpasswd.sh.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Same-origin API access for the web app: /api/predict -> http://api:8000/predict
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 5000;
    server_name _;
    client_max_body_size 200m;
    auth_basic "PSX Sentient MLflow";
    auth_basic_user_file /etc/nginx/htpasswd;
    location / {
        proxy_pass http://mlflow:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

server {
    listen 9090;
    server_name _;
    auth_basic "PSX Sentient Prometheus";
    auth_basic_user_file /etc/nginx/htpasswd;
    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
    }
}
