name: PSX-Sentient CI & Daily Pre-Market Inference

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Runs at 03:30 UTC (08:30 AM PKT) Monday–Friday before PSX 09:30 AM market open
    # Captures overnight domestic news, US market closes (Brent/DXY), and PSX off-market NDM files
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

env:
  PYTHONPATH: "."
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-and-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Verify Committed Snapshot & Run Full Unit Test Suite
        run: |
          test -f models/latest_signals.json
          python -m pytest -v

      - name: Run Live PSX News & Pre-Market Inference Check (Scheduled / Manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m src.nlp.finbert_engine
